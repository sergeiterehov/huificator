name: Release extension

# Собирает расширение и прикладывает ZIP к GitHub-релизу.
#
# Запуск: пуш тега, например
#   git tag v2.0 && git push origin v2.0
#
# Что делает: ставит зависимости, прогоняет тесты, собирает ядро и расширение,
# пакует dist в ZIP (npm run pack:zip) и прикрепляет архив к релизу.

on:
  push:
    tags:
      - "v*"

# Нужно, чтобы создать релиз от имени GITHUB_TOKEN
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка и упаковка
        run: npm run pack:zip

      - name: Версия и артефакт
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('packages/extension/dist/manifest.json','utf8')).version")"
          asset="release/zhurbanizator-$version.zip"

          cp release/zhurbanizator.zip "$asset"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

          if [[ "${TAG#v}" != "$version" ]]; then
            echo "::warning::Тег $TAG не совпадает с версией в манифесте ($version)"
          fi

          echo "### Журбанизатор $version" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$asset" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          asset="${{ steps.package.outputs.asset }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            # Релиз уже есть (повторный запуск) — перекладываем только архив
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "Журбанизатор ${{ steps.package.outputs.version }}" \
              --generate-notes
          fi
